name = "padel-play"
compatibility_date = "2024-12-01"
pages_build_output_dir = "dist"

# Turso (libSQL) — set via .dev.vars locally and Pages Dashboard > Settings > Variables/Secrets in production
# TURSO_DATABASE_URL is like libsql://your-db-username.turso.io
# TURSO_AUTH_TOKEN is generated via `turso db tokens create <db-name>`
# For local dev, copy .dev.vars.example -> .dev.vars
# NOTE: Keep [vars] commented unless you want defaults baked into the build.
# Example (uncomment to set defaults):
# [vars]
# TURSO_DATABASE_URL = "libsql://example.turso.io"

# Additional bindings as needed:
# [[kv_namespaces]]
# binding = "MY_KV"
# id = "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"

# [[kv_namespaces]]
# binding = "MY_KV"
# id = "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"

# [[d1_databases]]
# binding = "DB"
# database_name = "padel-play-db"
# database_id = "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"

# [env.production.vars]
# API_URL = "https://api.example.com"
